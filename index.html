<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BandPlayer</title><meta name="theme-color" content="#10131b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BandPlayer"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./css/styles.css"></head><body><main><header><h1>BandPlayer</h1><p>Open a BandPlayer MKV. Your audio stays on your device.</p></header><section class="panel"><label class="file-button">Open MKV<input id="file" type="file" accept=".mkv,video/x-matroska,audio/x-matroska" hidden></label><p id="status" role="status">Choose a file to begin.</p><div class="audio-diagnostic"><button id="test-html-audio" type="button">Test HTML Audio</button><span id="audio-state" role="status">Audio: not started</span></div><div id="transport" hidden><div class="transport"><button id="play" disabled>Play</button><button id="stop" disabled>Stop</button><input id="seek" aria-label="Seek" type="range" min="0" max="1000" value="0"><span id="clock">0:00 / 0:00</span></div><div class="master-volume"><label for="master-volume">Master volume</label><input id="master-volume" aria-label="Master volume" type="range" min="0" max="100" value="100"><output id="master-volume-value">100%</output></div><div id="tracks"></div></div></section><footer>BandPlayer v0.2.6 · HTML Audio · Static site · Client-side processing</footer></main><script type="module" src="./js/app.js"></script><script src="./js/pwa.js" defer></script></body></html>
